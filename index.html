<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Судоку</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#23211d;--mute:#8a857b;--line:#d9d4c8;--thick:#23211d;--sel:#ffe9a8;--peer:#f1ece0;--same:#ffd27a;--given:#23211d;--user:#2b5fd9;--err:#d93a3a;--errbg:#fde2e2;--accent:#2b5fd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16150f;--card:#201e17;--ink:#ece8dc;--mute:#8f897b;--line:#3a372c;--thick:#ece8dc;--sel:#5a4a14;--peer:#2a271d;--same:#6b5416;--given:#ece8dc;--user:#7da2ff;--err:#ff7a7a;--errbg:#4a2020;--accent:#7da2ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16150f;--card:#201e17;--ink:#ece8dc;--mute:#8f897b;--line:#3a372c;--thick:#ece8dc;--sel:#5a4a14;--peer:#2a271d;--same:#6b5416;--given:#ece8dc;--user:#7da2ff;--err:#ff7a7a;--errbg:#4a2020;--accent:#7da2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top h1{font-size:20px;margin:0}
.timer{font-variant-numeric:tabular-nums;color:var(--mute);font-size:16px}
.lv{display:flex;gap:6px;margin-bottom:10px}
.lv button{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px}
.lv button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--thick);border-radius:6px;overflow:hidden;background:var(--card);aspect-ratio:1}
.c{position:relative;display:flex;align-items:center;justify-content:center;border:.5px solid var(--line);font-size:clamp(18px,6vw,28px);user-select:none;cursor:pointer}
.c:nth-child(9n+3),.c:nth-child(9n+6){border-right:2px solid var(--thick)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--thick)}
.c.peer{background:var(--peer)}.c.same{background:var(--same)}.c.sel{background:var(--sel)}
.c.g{color:var(--given);font-weight:600}.c.u{color:var(--user)}
.c.bad{background:var(--errbg);color:var(--err)}
.n{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(7px,2.3vw,11px);color:var(--mute);text-align:center;align-items:center}
.tools{display:flex;gap:6px;margin:12px 0 8px}
.tools button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:13px}
.tools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pad button{padding:12px 0;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:10px;font-size:22px;position:relative}
.pad button.done{opacity:.25}
.msg{text-align:center;margin-top:12px;min-height:22px;color:var(--mute);font-size:14px}
.win{color:var(--accent);font-weight:600;font-size:16px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>Судоку</h1><div class="timer" id="t">00:00</div></div>
  <div class="lv" id="lv"></div>
  <div id="grid"></div>
  <div class="tools">
    <button id="bu">↶ Отмена</button>
    <button id="be">⌫ Стереть</button>
    <button id="bn">✎ Заметки</button>
    <button id="bh">💡 Подсказка</button>
  </div>
  <div class="pad" id="pad"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
const LV={easy:["Легко",41],med:["Средне",49],hard:["Сложно",54]};
let S={lv:"easy",p:[],sol:[],v:[],nt:[],sel:-1,note:false,hist:[],sec:0,won:false};
const $=id=>document.getElementById(id);
const bi=i=>((i/27|0)*3)+((i%9)/3|0);
const peers=(a,b)=>a!==b&&((a/9|0)===(b/9|0)||a%9===b%9||bi(a)===bi(b));

function search(g,limit,rand){
  const r=Array(9).fill(0),c=Array(9).fill(0),b=Array(9).fill(0);
  for(let i=0;i<81;i++)if(g[i]){const m=1<<(g[i]-1);r[i/9|0]|=m;c[i%9]|=m;b[bi(i)]|=m}
  let count=0,sol=null;
  (function rec(){
    let best=-1,bc=10,bm=0;
    for(let i=0;i<81;i++)if(!g[i]){
      const m=~(r[i/9|0]|c[i%9]|b[bi(i)])&511;
      let n=0,x=m;while(x){n++;x&=x-1}
      if(n<bc){bc=n;best=i;bm=m;if(!n)return}
    }
    if(best<0){count++;if(!sol)sol=g.slice();return}
    let ds=[];for(let d=1;d<=9;d++)if(bm&(1<<(d-1)))ds.push(d);
    if(rand)ds.sort(()=>Math.random()-.5);
    for(const d of ds){
      const m=1<<(d-1),R=best/9|0,C=best%9,B=bi(best);
      g[best]=d;r[R]|=m;c[C]|=m;b[B]|=m;
      rec();
      g[best]=0;r[R]&=~m;c[C]&=~m;b[B]&=~m;
      if(count>=limit)return;
    }
  })();
  return{count,sol};
}
function gen(lv){
  const sol=search(Array(81).fill(0),1,true).sol;
  const p=sol.slice(),order=[...Array(81).keys()].sort(()=>Math.random()-.5);
  let removed=0;const target=LV[lv][1];
  for(const i of order){
    if(removed>=target)break;
    const k=p[i];p[i]=0;
    if(search(p.slice(),2,false).count!==1)p[i]=k;else removed++;
  }
  return{p,sol};
}
function newGame(lv){
  S.lv=lv;const g=gen(lv);
  S.p=g.p;S.sol=g.sol;S.v=g.p.slice();S.nt=Array(81).fill(0);
  S.sel=-1;S.hist=[];S.sec=0;S.won=false;S.note=false;
  save();render();
}
function save(){try{localStorage.setItem("sudoku",JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem("sudoku");if(s){const o=JSON.parse(s);if(o&&o.p&&o.p.length===81){S=o;return true}}}catch(e){}return false}

function conflict(i){
  const v=S.v[i];if(!v||S.p[i])return false;
  for(let j=0;j<81;j++)if(peers(i,j)&&S.v[j]===v)return true;
  return false;
}
function snap(){S.hist.push([S.v.slice(),S.nt.slice()]);if(S.hist.length>200)S.hist.shift()}
function put(d){
  const i=S.sel;if(i<0||S.p[i]||S.won)return;
  snap();
  if(S.note){
    if(S.v[i])return;
    S.nt[i]^=1<<(d-1);
  }else{
    if(S.v[i]===d){S.v[i]=0}else{
      S.v[i]=d;S.nt[i]=0;
      for(let j=0;j<81;j++)if(peers(i,j))S.nt[j]&=~(1<<(d-1));
    }
  }
  check();save();render();
}
function erase(){const i=S.sel;if(i<0||S.p[i]||S.won)return;snap();S.v[i]=0;S.nt[i]=0;save();render()}
function undo(){if(S.won)return;const h=S.hist.pop();if(h){S.v=h[0];S.nt=h[1];save();render()}}
function hint(){
  if(S.won)return;
  let i=S.sel;
  if(i<0||S.p[i]||S.v[i]===S.sol[i]){
    const w=[];for(let j=0;j<81;j++)if(S.v[j]!==S.sol[j])w.push(j);
    if(!w.length)return;i=w[Math.random()*w.length|0];
  }
  snap();S.sel=i;S.v[i]=S.sol[i];S.nt[i]=0;
  for(let j=0;j<81;j++)if(peers(i,j))S.nt[j]&=~(1<<(S.sol[i]-1));
  check();save();render();
}
function check(){S.won=S.v.every((x,i)=>x===S.sol[i])}

function render(){
  const g=$("grid");let h="";
  const sv=S.sel>=0?S.v[S.sel]:0;
  for(let i=0;i<81;i++){
    let cl="c";
    if(S.p[i])cl+=" g";else if(S.v[i])cl+=" u";
    if(i===S.sel)cl+=" sel";
    else if(sv&&S.v[i]===sv)cl+=" same";
    else if(S.sel>=0&&peers(S.sel,i))cl+=" peer";
    if(conflict(i))cl+=" bad";
    let inner="";
    if(S.v[i])inner=S.v[i];
    else if(S.nt[i]){inner='<div class="n">';for(let d=1;d<=9;d++)inner+="<span>"+(S.nt[i]&(1<<(d-1))?d:"")+"</span>";inner+="</div>"}
    h+='<div class="'+cl+'" data-i="'+i+'">'+inner+"</div>";
  }
  g.innerHTML=h;
  const cnt=Array(10).fill(0);S.v.forEach(x=>cnt[x]++);
  document.querySelectorAll("#pad button").forEach(b=>b.classList.toggle("done",cnt[+b.dataset.d]>=9));
  $("bn").classList.toggle("on",S.note);
  document.querySelectorAll("#lv button").forEach(b=>b.classList.toggle("on",b.dataset.k===S.lv));
  $("msg").innerHTML=S.won?'<span class="win">Готово! Ты решила за '+fmt(S.sec)+' 🎉</span>':"";
  tick();
}
const fmt=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tick(){$("t").textContent=fmt(S.sec)}

$("grid").addEventListener("click",e=>{const c=e.target.closest(".c");if(c){S.sel=+c.dataset.i;render()}});
$("bu").onclick=undo;$("be").onclick=erase;$("bh").onclick=hint;
$("bn").onclick=()=>{S.note=!S.note;render()};
for(let d=1;d<=9;d++){const b=document.createElement("button");b.textContent=d;b.dataset.d=d;b.onclick=()=>put(d);$("pad").appendChild(b)}
for(const k in LV){const b=document.createElement("button");b.textContent=LV[k][0];b.dataset.k=k;b.onclick=()=>{if(S.lv===k&&!S.won&&S.hist.length&&!confirm("Начать новую игру?"))return;newGame(k)};$("lv").appendChild(b)}
document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="9")put(+e.key);
  else if(e.key==="Backspace"||e.key==="Delete")erase();
  else if(e.key==="n")S.note=!S.note,render();
  else if(e.key.startsWith("Arrow")&&S.sel>=0){
    const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
    const n=S.sel+d;if(n>=0&&n<81&&!(d===1&&S.sel%9===8)&&!(d===-1&&S.sel%9===0)){S.sel=n;render()}
  }
});
setInterval(()=>{if(!S.won&&!document.hidden){S.sec++;tick();if(S.sec%5===0)save()}},1000);

if(load())render();else newGame("easy");
</script>
</body>
</html>
